services:
  api:
    build: ./backend
    # Zero setup: the API starts at once and, on the first start, installs the shipped models,
    # downloads the match history (~5 min) and today's fixtures in the background.
    # Progress: http://localhost:8088/api/v1/health -> "setup".
    env_file:
      # Optional (FOOTBALL_DATA_ORG_KEY for the Champions League etc.); values below override it.
      - path: ./backend/.env
        required: false
    environment:
      MP_HOST: 0.0.0.0
      MP_PORT: "8000"
      MP_DATABASE_URL: sqlite:////app/backend/data/app.db
      MP_ARTIFACT_PATH: /app/backend/artifacts/model.joblib
      MP_EUROPE_ARTIFACT_PATH: /app/backend/artifacts/europe.joblib
      MP_V2_ARTIFACT_PATH: /app/backend/artifacts/model_v2.joblib
      MP_HISTORY_CSV: /app/data/raw/Matches.csv
      MP_OPENFOOTBALL_DIR: /app/backend/data/openfootball
      MP_BOOTSTRAP_ENABLED: "true"
      MP_CORS_ORIGINS: http://localhost:${MP_WEB_PORT:-8088},http://127.0.0.1:${MP_WEB_PORT:-8088}
    volumes:
      # Optional: data/raw/Matches.csv (if present) is used instead of downloading the history.
      - ./data/raw:/app/data/raw:ro
      # Models: named volume, filled from the shipped backend/models on first start.
      # To use your own trained models see README ("Use your own models").
      - api-artifacts:/app/backend/artifacts
      - api-db:/app/backend/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      # Bound to IPv4 loopback only: on some Windows machines a system process (DllHost) mirrors
      # Docker's [::] listeners on [::1] and never answers, so "localhost" hangs. With no IPv6
      # listener the browser falls straight back to 127.0.0.1. (Also keeps the app local-only.)
      # Change the port with MP_WEB_PORT (e.g. MP_WEB_PORT=8099 docker compose up -d).
      - "127.0.0.1:${MP_WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-db:
  api-artifacts:
